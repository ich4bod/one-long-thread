server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
    client_max_body_size 1m;
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
